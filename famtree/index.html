<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Famtree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="brand-name">Famtree</p>
        <p class="brand-sub">arbore genealogic</p>
      </div>
      <label class="focus-label">
        <span>Side</span>
        <select id="side-select">
          <option value="all">Both</option>
          <option value="oghina">Oghina</option>
          <option value="zachia">Zachia</option>
        </select>
      </label>
      <label class="focus-label">
        <span>Focus</span>
        <select id="focus-select"></select>
      </label>
      <div class="toolbar">
        <button type="button" id="btn-fit" title="Fit all">Fit</button>
        <button type="button" id="btn-reset" title="Clear focus">All</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <svg id="tree" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="stage-foot">
        <a href="https://photos.app.goo.gl/UbX5fKRvFs15fVyT9" target="_blank" rel="noopener noreferrer">Andrei's side family memories</a>
        <span>·</span>
        <p id="data-source" hidden></p>
      </div>
      <div class="hint" id="hint">Scroll to zoom · drag to pan · click a person</div>
    </main>

    <aside class="panel" id="panel" hidden>
      <button type="button" class="panel-close" id="panel-close" aria-label="Close">×</button>
      <button type="button" class="panel-photo-btn" id="panel-photo-btn" hidden>
        <img id="panel-photo" class="panel-photo" alt="" />
      </button>
      <h2 id="panel-name"></h2>
      <p class="panel-nick" id="panel-nick"></p>
      <p class="panel-dates" id="panel-dates"></p>
      <p class="panel-bio" id="panel-bio" hidden></p>
      <dl class="panel-meta" id="panel-meta"></dl>
      <p class="panel-notes" id="panel-notes"></p>
    </aside>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
      <img id="lightbox-photo" class="lightbox-photo" alt="" />
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
